[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloakbrowser-manager"
version = "0.1.0"
description = "CloakBrowser Manager — FastAPI application for browser profile management with live VNC viewing."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.104",
    "uvicorn>=0.32",
    "websockets>=12.0",
    "httpx>=0.24",
    "pydantic>=2.7",
]

# NOTE: cloakbrowser is NOT listed here — it is installed separately
# (via pip or Dockerfile) because it bundles a large Chromium binary
# that should not be pulled by every pip install of CBM.
# In VNC-only mode, cloakbrowser is not needed at all.

[project.optional-dependencies]
browser = ["cloakbrowser>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
cloakbrowser-manager = "backend.main:main"

[tool.hatch.build]
include = ["backend"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
